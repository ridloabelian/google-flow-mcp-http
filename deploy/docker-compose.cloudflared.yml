services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: google-flow-cloudflared
    depends_on:
      flow-mcp-server:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - flow_internal
    restart: unless-stopped
